<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cambiar contraseña · 100TCompras</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #e4e8ed; color: #223c61; font-family: Arial, sans-serif; }
    main { width: min(100%, 390px); min-height: 100vh; padding: 28px 20px; background: #f8f9fb; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 24px; }
    h1 { margin: 0; font-size: 22px; }
    .volver { color: #365d8d; text-decoration: none; white-space: nowrap; font-size: 14px; }
    section { padding: 18px; border: 1px solid #e1e5eb; border-radius: 14px; background: white; }
    label { display: block; margin: 14px 0 6px; font-weight: bold; font-size: 14px; }
    input { width: 100%; min-height: 44px; padding: 11px; border: 1px solid #cbd2dc; border-radius: 9px; font: inherit; }
    button { margin-top: 16px; padding: 11px 14px; border: 0; border-radius: 9px; background: #223c61; color: white; font: inherit; }
    .mensaje { min-height: 22px; font-size: 14px; }
    @media (max-width: 430px) { body { display: block; background: #f8f9fb; } }
  </style>
  <script src="/app/cambiar_contrasena.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>Cambiar contraseña</h1>
      <a class="volver" href="/app/">Menú principal</a>
    </header>
    <section>
      <p>Tu nombre de usuario no cambia. Para actualizar la contraseña, confirmá la actual y escribí la nueva.</p>
      <form id="formulario-contrasena">
        <label for="contrasena-actual">Contraseña actual</label>
        <input id="contrasena-actual" type="password" required autocomplete="current-password">
        <label for="contrasena-nueva">Contraseña nueva</label>
        <input id="contrasena-nueva" type="password" required maxlength="128" autocomplete="new-password">
        <label for="confirmar-contrasena">Repetí la contraseña nueva</label>
        <input id="confirmar-contrasena" type="password" required maxlength="128" autocomplete="new-password">
        <button id="boton-guardar" type="submit">Guardar contraseña</button>
      </form>
      <p id="mensaje" class="mensaje" role="status"></p>
    </section>
  </main>
</body>
</html>
