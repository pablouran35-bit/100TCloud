<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fotos de entrega · 100TCompras</title><style>
    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #e4e8ed;
      color: #223c61;
      font-family: Arial, sans-serif;
    }

    main {
      width: min(100%, 390px);
      height: min(844px, 100vh);
      min-height: 0;
      margin: 0 auto;
      padding: 22px 18px;
      background: #f8f9fb;
      overflow-y: auto;
      box-shadow: 0 12px 40px #223c6126;

      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      flex-shrink: 0;
    }

    h1 {
      margin: 0;
      font-size: 22px;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 19px;
    }

    h3 {
      margin: 0 0 8px;
      font-size: 16px;
    }

    p {
      line-height: 1.4;
    }

    .volver {
      color: #365d8d;
      text-decoration: none;
      white-space: nowrap;
      font-size: 14px;
    }

    .bloque {
      margin: 12px 0;
      padding: 14px;
      border: 1px solid #e1e5eb;
      border-radius: 14px;
      background: white;
    }

    button {
      padding: 11px 13px;
      border: 0;
      border-radius: 9px;
      background: #223c61;
      color: white;
      font: inherit;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .secundario {
      background: #eaf1fb;
      color: #223c61;
    }

    /*
      La lista ahora ocupa solamente el espacio disponible
      dentro de la pantalla. El botón de confirmar queda
      siempre debajo y no desaparece aunque haya muchas solicitudes.
    */
    .lista-scroll {
      max-height: 430px;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 4px;
      border: 1px solid #e1e5eb;
      border-radius: 12px;
      background: #f8f9fb;
    }

    .item {
      display: block;
      width: 100%;
      margin: 5px 0;
      padding: 12px;
      border: 1px solid #e1e5eb;
      border-radius: 10px;
      background: white;
      color: #223c61;
      text-align: left;
      font: inherit;
    }

    .item strong,
    .item small {
      display: block;
    }

    .item small {
      margin-top: 4px;
      color: #647184;
      line-height: 1.4;
    }

    .solicitud-entrega {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .solicitud-entrega input {
      width: 22px;
      min-width: 22px;
      height: 22px;
      min-height: 22px;
      margin: 1px 0 0;
      accent-color: #223c61;
    }

    .solicitud-entrega span {
      flex: 1;
    }

    .fila-solicitud {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 5px 0;
      padding: 10px;
      border: 1px solid #e1e5eb;
      border-radius: 10px;
      background: white;
    }

    .fila-solicitud .item {
      flex: 1;
      margin: 0;
      padding: 4px;
      border: 0;
    }

    .estado {
      display: inline-block;
      margin-top: 7px;
      padding: 4px 8px;
      border-radius: 99px;
      background: #eaf1fb;
      color: #245a91;
      font-size: 12px;
      font-weight: bold;
    }

    .ayuda,
    .detalle {
      color: #647184;
    }

    .ayuda {
      font-size: 13px;
    }

    .botones {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    /*
      Zona fija dentro de la sección de solicitudes.
      El botón queda separado de la lista y siempre visible.
    */
    #vista-solicitudes {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    #vista-solicitudes .lista-scroll {
      flex: 0 1 auto;
      min-height: 120px;
    }

    #vista-solicitudes > .botones:last-child {
      flex-shrink: 0;
      padding-top: 4px;
      margin-top: 12px;
      background: white;
    }

    #boton-registrar-entrega {
      width: 100%;
      font-weight: bold;
    }

    .historial {
      max-height: 360px;
      overflow-y: auto;
      margin: 8px 0;
      padding: 0;
      list-style: none;
    }

    .registro {
      margin: 7px 0;
      padding: 9px;
      border: 1px solid #e1e5eb;
      border-radius: 9px;
      background: #f8f9fb;
      font-size: 13px;
    }

    .registro strong,
    .registro small {
      display: block;
    }

    .registro small {
      margin-top: 3px;
      color: #647184;
    }

    .dialogo {
      width: min(calc(100% - 30px), 350px);
      max-height: min(84vh, 740px);
      overflow-y: auto;
      padding: 17px;
      border: 0;
      border-radius: 16px;
      color: #223c61;
      background: white;
      box-shadow: 0 12px 40px #223c6140;
    }

    .dialogo::backdrop {
      background: #17243b80;
    }

    .cerrar {
      display: block;
      margin-left: auto;
    }

    .mensaje {
      min-height: 20px;
      margin: 10px 0 0;
      font-size: 14px;
    }

    @media (max-width: 430px) {
      body {
        display: block;
        background: #f8f9fb;
      }

      main {
        width: 100%;
        height: 100vh;
        height: 100dvh;
        min-height: 100vh;
        min-height: 100dvh;
        box-shadow: none;
      }

      /*
        En celular dejamos la lista más compacta para que
        el botón de confirmar quede siempre dentro de la pantalla.
      */
      .lista-scroll {
        max-height: 360px;
      }
    }
    #vista-solicitudes{flex-shrink:0}.fila-solicitud strong,.fila-solicitud small{display:block}
    .fotos-grilla{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}
    .fotos-grilla figure{margin:0;min-width:0}.fotos-grilla img{display:block;width:100%;height:110px;object-fit:cover;border-radius:8px}.fotos-grilla button{width:100%;padding:5px}.fotos-grilla figcaption{font-size:12px;overflow-wrap:anywhere;margin-top:6px}.foto-abrir{background:none}
    #fotos-planilla{margin-top:22px;border-top:1px solid #ddd;padding-top:18px}#dialogo-foto{max-width:90vw;width:800px}#foto-ampliada{max-width:100%;max-height:70vh;object-fit:contain}#buscar-numero-planilla{width:100%;padding:10px;font:inherit}
  main{display:block}#fotos-planilla{border:0;margin-top:10px}</style><script src="/app/fotos_entregas.js" defer></script><script src="/app/fotos_planilla_pagina.js" defer></script></head><body><main><a id="volver-fotos" class="volver" href="/app/entregas.html">← Volver</a><h1 id="titulo-fotos-planilla">Fotos de entrega</h1><p id="info-fotos-planilla"></p>      <section id="fotos-planilla">
        <h3>Fotos de entrega de esta planilla</h3>
        <p class="ayuda">Podés agregar varias fotos. Se reducen y comprimen antes de subirlas. Las fotos se guardan con conexión, por separado del registro de materiales entregados.</p>
        <div class="botones"><button id="abrir-camara" type="button">📷 Sacar foto</button><button id="abrir-galeria" type="button" class="secundario">Elegir de galería</button></div>
        <input id="camara-foto" type="file" accept="image/*" capture="environment" hidden>
        <input id="galeria-foto" type="file" accept="image/*" multiple hidden>
        <div id="fotos-pendientes" class="fotos-grilla"></div>
        <button id="subir-fotos" type="button" disabled>Subir fotos (0)</button>
        <p id="mensaje-fotos" class="mensaje" role="status"></p>
        <div id="fotos-guardadas" class="fotos-grilla"></div>
      </section></main>  <dialog id="dialogo-foto" class="dialogo"><button id="cerrar-foto" type="button">Cerrar foto</button><p id="foto-datos"></p><img id="foto-ampliada" alt="Foto de la entrega ampliada"></dialog></body></html>
