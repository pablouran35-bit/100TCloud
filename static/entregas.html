<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entregas · 100TCompras</title>
  <link rel="manifest" href="/app/manifest.webmanifest">
  <meta name="theme-color" content="#223c61">
  <script src="/app/offline-db.js" defer></script>
  <script src="/app/offline.js" defer></script>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #e4e8ed; color: #223c61; font-family: Arial, sans-serif; }
    main { width: min(100%, 390px); height: min(844px, 100vh); min-height: 0; margin: 0 auto; padding: 22px 18px; background: #f8f9fb; overflow-y: auto; box-shadow: 0 12px 40px #223c6126; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    h1 { margin: 0; font-size: 22px; } h2 { margin: 0 0 12px; font-size: 19px; } h3 { margin: 0 0 8px; font-size: 16px; }
    p { line-height: 1.4; }
    .volver { color: #365d8d; text-decoration: none; white-space: nowrap; font-size: 14px; }
    .bloque { margin: 12px 0; padding: 14px; border: 1px solid #e1e5eb; border-radius: 14px; background: white; }
    button { padding: 11px 13px; border: 0; border-radius: 9px; background: #223c61; color: white; font: inherit; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .secundario { background: #eaf1fb; color: #223c61; }
    .lista-scroll { max-height: 570px; overflow-y: auto; overscroll-behavior: contain; padding: 4px; border: 1px solid #e1e5eb; border-radius: 12px; background: #f8f9fb; }
    .item { display: block; width: 100%; margin: 5px 0; padding: 12px; border: 1px solid #e1e5eb; border-radius: 10px; background: white; color: #223c61; text-align: left; font: inherit; }
    .item strong, .item small { display: block; }
    .item small { margin-top: 4px; color: #647184; line-height: 1.4; }
    .solicitud-entrega { display: flex; align-items: flex-start; gap: 10px; }
    .solicitud-entrega input { width: 22px; min-width: 22px; height: 22px; min-height: 22px; margin: 1px 0 0; accent-color: #223c61; }
    .solicitud-entrega span { flex: 1; }
    .fila-solicitud { display: flex; align-items: center; gap: 8px; margin: 5px 0; padding: 10px; border: 1px solid #e1e5eb; border-radius: 10px; background: white; }
    .fila-solicitud .item { flex: 1; margin: 0; padding: 4px; border: 0; }
    .estado { display: inline-block; margin-top: 7px; padding: 4px 8px; border-radius: 99px; background: #eaf1fb; color: #245a91; font-size: 12px; font-weight: bold; }
    .ayuda, .detalle { color: #647184; }
    .ayuda { font-size: 13px; }
    .botones { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .historial { max-height: 360px; overflow-y: auto; margin: 8px 0; padding: 0; list-style: none; }
    .registro { margin: 7px 0; padding: 9px; border: 1px solid #e1e5eb; border-radius: 9px; background: #f8f9fb; font-size: 13px; }
    .registro strong, .registro small { display: block; }
    .registro small { margin-top: 3px; color: #647184; }
    .dialogo { width: min(calc(100% - 30px), 350px); max-height: min(84vh, 740px); overflow-y: auto; padding: 17px; border: 0; border-radius: 16px; color: #223c61; background: white; box-shadow: 0 12px 40px #223c6140; }
    .dialogo::backdrop { background: #17243b80; }
    .cerrar { display: block; margin-left: auto; }
    .mensaje { min-height: 20px; margin: 10px 0 0; font-size: 14px; }
    @media (max-width: 430px) { body { display: block; background: #f8f9fb; } main { width: 100%; height: 100vh; height: 100dvh; min-height: 100vh; min-height: 100dvh; box-shadow: none; } }
  </style>
  <script src="/app/entregas.js" defer></script>
</head>
<body>
  <main>
    <header><h1>Entregas</h1><a class="volver" href="/app/">Menú principal</a></header>
    <section id="vista-planillas" class="bloque">
      <h2>Planillas con material para entregar</h2>
      <p class="ayuda">Se muestran solicitudes compradas y disponibles para entregar.</p>
      <p id="cantidad-planillas" class="mensaje"></p>
      <div id="lista-planillas" class="lista-scroll"></div>
      <p id="mensaje-planillas" class="mensaje" role="status"></p>
    </section>
    <section id="vista-solicitudes" class="bloque" hidden>
      <button id="volver-planillas" class="secundario" type="button">← Volver a planillas</button>
      <h2 id="titulo-planilla"></h2>
      <p id="fecha-planilla" class="ayuda"></p>
      <p id="cantidad-seleccionada" class="mensaje">0 solicitudes seleccionadas</p>
      <div class="botones">
        <button id="boton-seleccionar-todas" class="secundario" type="button">Seleccionar todas</button>
        <button id="boton-deseleccionar" class="secundario" type="button">Quitar selección</button>
      </div>
      <div id="lista-solicitudes" class="lista-scroll"></div>
      <p id="mensaje-solicitudes" class="mensaje" role="status"></p>
      <div class="botones"><button id="boton-registrar-entrega" type="button" disabled>Marcar seleccionadas como entregadas</button></div>
    </section>
  </main>

  <dialog id="dialogo-historial" class="dialogo" aria-labelledby="titulo-historial">
    <button class="secundario cerrar" type="button" data-cerrar="dialogo-historial">Cerrar</button>
    <h2 id="titulo-historial">Historial de la solicitud</h2>
    <p id="detalle-solicitud" class="detalle"></p>
    <ul id="lista-historial" class="historial"></ul>
  </dialog>
</body>
</html>
