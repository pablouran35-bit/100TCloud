<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administración · 100TCompras</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #e4e8ed;
      color: #223c61;
      font-family: Arial, sans-serif;
    }

    main {
      width: min(100%, 390px);
      height: min(844px, 100vh);
      min-height: 0;
      margin: 0 auto;
      padding: 24px 20px;
      background: #f8f9fb;
      overflow-y: auto;
      box-shadow: 0 12px 40px #223c6126;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
    }

    h1 { margin: 0; font-size: 22px; }
    h2 { margin: 0 0 14px; font-size: 19px; }
    p { line-height: 1.45; }

    .volver {
      color: #365d8d;
      text-decoration: none;
    }

    .bloque {
      margin: 18px 0;
      padding: 16px;
      border: 1px solid #e1e5eb;
      border-radius: 14px;
      background: white;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-size: 14px;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid #cbd2dc;
      border-radius: 9px;
      background: white;
      color: #223c61;
      font: inherit;
    }

    input { min-height: 44px; }

    textarea {
      min-height: 75px;
      resize: vertical;
    }

    button {
      padding: 10px 13px;
      border: 0;
      border-radius: 9px;
      background: #223c61;
      color: white;
      font: inherit;
      cursor: pointer;
    }

    button:disabled { opacity: 0.6; cursor: wait; }

    .botones {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .secundario {
      background: #eaf1fb;
      color: #223c61;
    }

    .lista-scroll {
      height: 240px;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 4px;
      border: 1px solid #e1e5eb;
      border-radius: 12px;
      background: #f8f9fb;
    }

    .obra {
      display: block;
      width: 100%;
      margin: 4px 0;
      padding: 13px;
      border: 1px solid #e1e5eb;
      border-radius: 9px;
      background: white;
      color: #223c61;
      text-align: left;
      font: inherit;
      cursor: pointer;
    }

    .obra.seleccionada {
      border-color: #365d8d;
      background: #eaf1fb;
    }

    .obra strong, .obra small { display: block; }
    .obra small { margin-top: 4px; color: #647184; line-height: 1.35; }

    .dialogo {
      width: min(calc(100% - 32px), 340px);
      max-height: min(80vh, 700px);
      overflow-y: auto;
      padding: 18px;
      border: 0;
      border-radius: 16px;
      color: #223c61;
      background: white;
      box-shadow: 0 12px 40px #223c6140;
    }

    .dialogo::backdrop { background: #17243b80; }
    .dialogo-cerrar { display: block; margin-left: auto; }
    .dialogo p { margin: 6px 0; color: #647184; overflow-wrap: anywhere; }
    .lista-contratistas { max-height: 240px; overflow-y: auto; margin-top: 12px; padding: 8px 12px; border: 1px solid #e1e5eb; border-radius: 10px; background: #f8f9fb; }
    .contratista { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; border-bottom: 1px solid #e1e5eb; font-size: 14px; }
    .contratista:last-child { border-bottom: 0; }
    .contratista input { width: 18px; min-height: 18px; height: 18px; margin: 1px 0 0; }
    .mensaje { min-height: 20px; font-size: 14px; }
    [hidden] { display: none !important; }

    @media (max-width: 430px) {
      body { display: block; background: #f8f9fb; }

      main {
        width: 100%;
        height: 100vh;
        height: 100dvh;
        min-height: 100vh;
        min-height: 100dvh;
        box-shadow: none;
      }
    }
  </style>

  <script src="/app/administracion.js" defer></script>
</head>

<body>
  <main>
    <header>
      <h1>Administración · Obras</h1>
      <a class="volver" href="/app/administracion_menu.html">Menú de Administración</a>
    </header>

    <p id="acceso-denegado" hidden>
      Esta sección es solo para empleados y administradores.
    </p>

    <div id="contenido" hidden>
      <section class="bloque">
        <h2 id="titulo-formulario">Agregar una obra</h2>

        <form id="formulario-obra">
          <label for="nombre">Nombre de la obra</label>
          <input id="nombre" name="nombre" required maxlength="150">

          <label for="direccion">Dirección</label>
          <input id="direccion" name="direccion" maxlength="250">

          <label for="observaciones">Observaciones</label>
          <textarea id="observaciones" name="observaciones"></textarea>

          <div class="botones">
            <button id="boton-guardar" type="submit">Guardar obra</button>
            <button
              id="boton-cancelar"
              class="secundario"
              type="button"
              hidden
            >
              Cancelar edición
            </button>
          </div>
        </form>

        <p id="mensaje" class="mensaje" role="status"></p>
      </section>

      <section class="bloque">
        <h2>Buscar obra</h2>
        <label for="busqueda-obra">Escribí el nombre</label>
        <input
          id="busqueda-obra"
          type="search"
          placeholder="Nombre de la obra"
          autocomplete="off"
        >
        <p id="cantidad-resultados" class="mensaje"></p>
        <div id="lista-obras" class="lista-scroll"></div>

        <dialog
          id="detalle-obra"
          class="dialogo"
          aria-labelledby="detalle-nombre"
        >
          <button
            id="boton-cerrar-detalle"
            class="secundario dialogo-cerrar"
            type="button"
          >
            Cerrar
          </button>
          <h3 id="detalle-nombre"></h3>
          <p id="detalle-estado"></p>
          <p id="detalle-contratistas"></p>
          <p id="detalle-direccion"></p>
          <p id="detalle-observaciones"></p>

          <div class="botones">
            <button id="boton-asignar-contratistas" class="secundario" type="button">
              Asignar contratistas
            </button>
            <button id="boton-modificar" class="secundario" type="button">
              Modificar
            </button>
            <button id="boton-cambiar-estado" class="secundario" type="button">
              Desactivar
            </button>
          </div>
        </dialog>

        <dialog id="dialogo-contratistas" class="dialogo" aria-labelledby="titulo-contratistas">
          <button id="boton-cerrar-contratistas" class="secundario dialogo-cerrar" type="button">Cerrar</button>
          <h3 id="titulo-contratistas">Contratistas de la obra</h3>
          <p>Podés asignar varios contratistas a esta obra. Cada contratista también puede tener varias obras.</p>
          <div id="lista-contratistas" class="lista-contratistas"></div>
          <p id="mensaje-contratistas" class="mensaje" role="status"></p>
          <div class="botones"><button id="boton-guardar-contratistas" type="button">Guardar asignación</button></div>
        </dialog>
      </section>
    </div>
  </main>
</body>
</html>
