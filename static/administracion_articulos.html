<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administración · Artículos</title>

  <style>
    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #e4e8ed;
      color: #223c61;
      font-family: Arial, sans-serif;
    }

    main {
      width: min(100%, 390px);
      height: min(844px, 100vh);
      min-height: 0;
      margin: 0 auto;
      padding: 24px 20px;
      background: #f8f9fb;
      overflow-y: auto;
      box-shadow: 0 12px 40px #223c6126;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
    }

    h2 {
      margin: 0 0 14px;
      font-size: 19px;
    }

    h3 {
      margin: 0 0 8px;
      font-size: 17px;
    }

    p {
      line-height: 1.45;
    }

    .volver {
      color: #365d8d;
      text-decoration: none;
      white-space: nowrap;
      font-size: 14px;
    }

    .bloque {
      margin: 18px 0;
      padding: 16px;
      border: 1px solid #e1e5eb;
      border-radius: 14px;
      background: white;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-size: 14px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid #cbd2dc;
      border-radius: 9px;
      background: white;
      color: #223c61;
      font: inherit;
    }

    input,
    select {
      min-height: 44px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      padding: 10px 13px;
      border: 0;
      border-radius: 9px;
      background: #223c61;
      color: white;
      font: inherit;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .botones {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .secundario {
      background: #eaf1fb;
      color: #223c61;
    }

    .lista-scroll {
      height: 240px;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 4px;
      border: 1px solid #e1e5eb;
      border-radius: 12px;
      background: #f8f9fb;
    }

    .articulo {
      display: block;
      width: 100%;
      margin: 4px 0;
      padding: 13px;
      border: 1px solid #e1e5eb;
      border-radius: 9px;
      background: white;
      color: #223c61;
      text-align: left;
      font: inherit;
      cursor: pointer;
    }

    .articulo.seleccionado {
      border-color: #365d8d;
      background: #eaf1fb;
    }

    .dialogo {
      width: min(calc(100% - 32px), 340px);
      max-height: min(80vh, 700px);
      overflow-y: auto;
      padding: 18px;
      border: 0;
      border-radius: 16px;
      color: #223c61;
      background: white;
      box-shadow: 0 12px 40px #223c6140;
    }

    .dialogo::backdrop {
      background: #17243b80;
    }

    .dialogo-cerrar {
      display: block;
      margin-left: auto;
    }

    .dialogo p {
      margin: 6px 0;
      color: #647184;
      overflow-wrap: anywhere;
    }

    .mensaje {
      min-height: 20px;
      font-size: 14px;
    }

    @media (max-width: 430px) {
      body {
        display: block;
        background: #f8f9fb;
      }

      main {
        width: 100%;
        height: 100vh;
        height: 100dvh;
        min-height: 100vh;
        min-height: 100dvh;
        box-shadow: none;
      }
    }
  </style>

  <script src="/app/administracion_articulos.js" defer></script>
</head>

<body>
  <main>
    <header>
      <h1>Administración · Artículos</h1>
      <a class="volver" href="/app/administracion_menu.html">
        Menú de Administración
      </a>
    </header>

    <p id="acceso-denegado" hidden>
      Esta sección es solo para empleados y administradores.
    </p>

    <div id="contenido" hidden>
      <section class="bloque">
        <h2 id="titulo-formulario">Agregar un artículo</h2>

        <form id="formulario-articulo">
          <label for="nombre">Nombre del artículo</label>
          <input
            id="nombre"
            name="nombre"
            required
            maxlength="150"
            placeholder="Ej.: Cemento Portland"
          >

          <label for="unidad">Unidad</label>
          <select id="unidad" name="unidad" required>
            <option value="">Elegí una unidad</option>
            <option value="UNIDAD">UNIDAD</option>
            <option value="KG">KG</option>
            <option value="GRAMOS">GRAMOS</option>
            <option value="LITRO">LITRO</option>
            <option value="METRO">METRO</option>
            <option value="METRO CUADRADO">METRO CUADRADO</option>
            <option value="METRO CÚBICO">METRO CÚBICO</option>
            <option value="CAJA">CAJA</option>
            <option value="BOLSA">BOLSA</option>
            <option value="BULTO">BULTO</option>
            <option value="ROLLO">ROLLO</option>
            <option value="PAR">PAR</option>
            <option value="JUEGO">JUEGO</option>
          </select>

          <label for="observaciones">Observaciones del artículo</label>
          <textarea
            id="observaciones"
            name="observaciones"
            maxlength="1000"
            placeholder="Detalles adicionales del artículo"
          ></textarea>

          <div class="botones">
            <button id="boton-guardar" type="submit">
              Guardar artículo
            </button>

            <button
              id="boton-cancelar"
              class="secundario"
              type="button"
              hidden
            >
              Cancelar edición
            </button>
          </div>
        </form>

        <p id="mensaje" class="mensaje" role="status"></p>
      </section>

      <section class="bloque">
        <h2>Buscar artículo</h2>

        <label for="busqueda-articulo">Escribí el nombre</label>
        <input
          id="busqueda-articulo"
          type="search"
          placeholder="Ej.: ceme"
          autocomplete="off"
        >

        <p id="cantidad-resultados" class="mensaje"></p>
        <div id="lista-articulos" class="lista-scroll"></div>

        <dialog
          id="detalle-articulo"
          class="dialogo"
          aria-labelledby="detalle-nombre"
        >
          <button
            id="boton-cerrar-detalle"
            class="secundario dialogo-cerrar"
            type="button"
          >
            Cerrar
          </button>

          <h3 id="detalle-nombre"></h3>
          <p id="detalle-unidad"></p>
          <p id="detalle-estado"></p>
          <p id="detalle-observaciones"></p>

          <div class="botones">
            <button
              id="boton-modificar"
              class="secundario"
              type="button"
            >
              Modificar
            </button>

            <button
              id="boton-cambiar-estado"
              class="secundario"
              type="button"
            >
              Desactivar
            </button>
          </div>
        </dialog>
      </section>
    </div>
  </main>
</body>
</html>
