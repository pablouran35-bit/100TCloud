<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administración · Usuarios</title>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #e4e8ed; color: #223c61; font-family: Arial, sans-serif; }
    main { width: min(100%, 390px); height: min(844px, 100vh); min-height: 0; margin: 0 auto; padding: 24px 20px; background: #f8f9fb; overflow-y: auto; box-shadow: 0 12px 40px #223c6126; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 24px; }
    h1 { margin: 0; font-size: 22px; } h2 { margin: 0 0 14px; font-size: 19px; } h3 { margin: 0 0 8px; font-size: 17px; }
    p { line-height: 1.45; }
    .volver { color: #365d8d; text-decoration: none; white-space: nowrap; font-size: 14px; }
    .bloque { margin: 18px 0; padding: 16px; border: 1px solid #e1e5eb; border-radius: 14px; background: white; }
    label { display: block; margin: 14px 0 6px; font-size: 14px; font-weight: bold; }
    input, select { width: 100%; min-height: 44px; padding: 11px; border: 1px solid #cbd2dc; border-radius: 9px; background: white; color: #223c61; font: inherit; }
    button { padding: 10px 13px; border: 0; border-radius: 9px; background: #223c61; color: white; font: inherit; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .botones { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .secundario { background: #eaf1fb; color: #223c61; }
    .ayuda { margin: 6px 0; color: #647184; font-size: 13px; }
    fieldset { margin: 16px 0 0; padding: 12px; border: 1px solid #d8dee8; border-radius: 10px; }
    legend { padding: 0 6px; font-weight: bold; font-size: 14px; }
    .rol { display: flex; align-items: center; gap: 9px; margin: 10px 0; font-size: 14px; }
    .rol input { width: 18px; min-height: 18px; height: 18px; margin: 0; }
    .lista-scroll { height: 240px; overflow-y: auto; overscroll-behavior: contain; padding: 4px; border: 1px solid #e1e5eb; border-radius: 12px; background: #f8f9fb; }
    .usuario-item { display: block; width: 100%; margin: 4px 0; padding: 13px; border: 1px solid #e1e5eb; border-radius: 9px; background: white; color: #223c61; text-align: left; font: inherit; cursor: pointer; }
    .usuario-item.seleccionado { border-color: #365d8d; background: #eaf1fb; }
    .dialogo { width: min(calc(100% - 32px), 340px); max-height: min(80vh, 700px); overflow-y: auto; padding: 18px; border: 0; border-radius: 16px; color: #223c61; background: white; box-shadow: 0 12px 40px #223c6140; }
    .dialogo::backdrop { background: #17243b80; }
    .dialogo-cerrar { display: block; margin-left: auto; }
    .dialogo p { margin: 6px 0; color: #647184; overflow-wrap: anywhere; }
    .mensaje { min-height: 20px; font-size: 14px; }
    @media (max-width: 430px) { body { display: block; background: #f8f9fb; } main { width: 100%; height: 100vh; height: 100dvh; min-height: 100vh; min-height: 100dvh; box-shadow: none; } }
  </style>
  <script src="/app/administracion_usuarios.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>Administración · Usuarios</h1>
      <a class="volver" href="/app/administracion_menu.html">Menú de Administración</a>
    </header>
    <p id="acceso-denegado" hidden>Esta sección es solo para administradores.</p>
    <div id="contenido" hidden>
      <section class="bloque">
        <h2 id="titulo-formulario">Crear usuario</h2>
        <form id="formulario-usuario">
          <div id="grupo-usuario">
            <label for="usuario">Nombre de usuario (queda fijo)</label>
            <input id="usuario" name="usuario" required maxlength="80" autocomplete="off">
          </div>
          <p id="usuario-fijo" class="ayuda" hidden></p>

          <div id="grupo-tipo-persona">
            <label for="tipo-persona">Persona asociada</label>
            <select id="tipo-persona">
              <option value="nueva">Registrar una persona nueva</option>
              <option value="existente">Elegir una persona ya cargada</option>
            </select>
          </div>
          <div id="grupo-persona-existente" hidden>
            <label for="persona-existente">Persona sin usuario</label>
            <select id="persona-existente"></select>
          </div>

          <div id="datos-persona">
            <label for="nombre">Nombre</label>
            <input id="nombre" name="nombre" required maxlength="100" autocomplete="given-name">
            <label for="apellido">Apellido</label>
            <input id="apellido" name="apellido" required maxlength="100" autocomplete="family-name">
            <label for="telefono">Teléfono</label>
            <input id="telefono" name="telefono" type="tel" maxlength="50">
            <label for="email">Correo electrónico</label>
            <input id="email" name="email" type="email" maxlength="150">
          </div>

          <div id="grupo-contrasena">
            <label for="contrasena">Contraseña inicial</label>
            <input id="contrasena" name="contrasena" type="password" required maxlength="128" autocomplete="new-password">
            <p id="ayuda-contrasena" class="ayuda">La asignás vos; la persona podrá cambiarla cuando quiera.</p>
          </div>

          <fieldset>
            <legend>Roles y permisos</legend>
            <div id="lista-roles"></div>
          </fieldset>
          <div class="botones">
            <button id="boton-guardar" type="submit">Crear usuario</button>
            <button id="boton-cancelar" class="secundario" type="button" hidden>Cancelar</button>
          </div>
        </form>
        <p id="mensaje" class="mensaje" role="status"></p>
      </section>

      <section class="bloque">
        <h2>Buscar usuario</h2>
        <label for="busqueda-usuario">Nombre o usuario</label>
        <input id="busqueda-usuario" type="search" placeholder="Escribí para buscar" autocomplete="off">
        <p id="cantidad-resultados" class="mensaje"></p>
        <div id="lista-usuarios" class="lista-scroll"></div>
        <dialog id="detalle-usuario" class="dialogo" aria-labelledby="detalle-nombre">
          <button id="boton-cerrar-detalle" class="secundario dialogo-cerrar" type="button">Cerrar</button>
          <h3 id="detalle-nombre"></h3>
          <p id="detalle-usuario-login"></p>
          <p id="detalle-roles"></p>
          <p id="detalle-estado"></p>
          <div class="botones">
            <button id="boton-modificar" class="secundario" type="button">Modificar datos y roles</button>
            <button id="boton-restablecer" class="secundario" type="button">Restablecer contraseña</button>
            <button id="boton-cambiar-estado" class="secundario" type="button">Desactivar</button>
          </div>
        </dialog>
        <dialog id="dialogo-contrasena" class="dialogo" aria-labelledby="titulo-contrasena">
          <button id="boton-cerrar-contrasena" class="secundario dialogo-cerrar" type="button">Cerrar</button>
          <h3 id="titulo-contrasena">Restablecer contraseña</h3>
          <p id="destinatario-contrasena"></p>
          <form id="formulario-contrasena">
            <label for="nueva-contrasena">Nueva contraseña</label>
            <input id="nueva-contrasena" type="password" required maxlength="128" autocomplete="new-password">
            <div class="botones"><button id="boton-guardar-contrasena" type="submit">Guardar contraseña</button></div>
          </form>
          <p id="mensaje-contrasena" class="mensaje" role="status"></p>
        </dialog>
      </section>
    </div>
  </main>
</body>
</html>
