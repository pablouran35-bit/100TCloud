<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tareas · 100TCompras</title>
  <link rel="manifest" href="/app/manifest.webmanifest">
  <meta name="theme-color" content="#223c61">
  <script src="/app/offline-db.js" defer></script>
  <script src="/app/offline.js" defer></script>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #e4e8ed; color: #223c61; font-family: Arial, sans-serif; }
    main { width: min(100%, 390px); height: min(844px, 100vh); min-height: 0; margin: 0 auto; padding: 24px 20px; background: #f8f9fb; overflow-y: auto; box-shadow: 0 12px 40px #223c6126; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 24px; }
    h1 { margin: 0; font-size: 22px; } h2 { margin: 0 0 14px; font-size: 19px; } h3 { margin: 0 0 8px; font-size: 17px; }
    p { line-height: 1.45; }
    .volver { color: #365d8d; text-decoration: none; white-space: nowrap; font-size: 14px; }
    .bloque { margin: 18px 0; padding: 16px; border: 1px solid #e1e5eb; border-radius: 14px; background: white; }
    label { display: block; margin: 14px 0 6px; font-size: 14px; font-weight: bold; }
    input, select, textarea { width: 100%; min-height: 44px; padding: 11px; border: 1px solid #cbd2dc; border-radius: 9px; background: white; color: #223c61; font: inherit; }
    textarea { min-height: 80px; resize: vertical; }
    button { padding: 11px 14px; border: 0; border-radius: 9px; background: #223c61; color: white; font: inherit; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .secundario { background: #eaf1fb; color: #223c61; }
    .botones { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .lista-scroll { max-height: 390px; overflow-y: auto; overscroll-behavior: contain; padding: 4px; border: 1px solid #e1e5eb; border-radius: 12px; background: #f8f9fb; }
    .item-tarea { display: block; width: 100%; margin: 5px 0; padding: 12px; border: 1px solid #e1e5eb; border-radius: 10px; background: white; color: #223c61; text-align: left; font: inherit; cursor: pointer; }
    .item-tarea strong, .item-tarea small { display: block; }
    .item-tarea small { margin-top: 5px; color: #647184; line-height: 1.4; }
    .estado { display: inline-block; margin-top: 8px; padding: 4px 8px; border-radius: 99px; background: #fff1d6; color: #754c00; font-size: 12px; font-weight: bold; }
    .estado[data-estado="EN PROCESO"] { background: #eaf1fb; color: #245a91; }
    .estado[data-estado="FINALIZADA"] { background: #e4f5eb; color: #276341; }
    .estado[data-estado="CANCELADA"] { background: #fde8e7; color: #b42318; }
    .ayuda, .detalle p { color: #647184; }
    .ayuda { font-size: 13px; }
    .historial { max-height: 210px; overflow-y: auto; margin: 10px 0; padding: 0; list-style: none; }
    .registro-historial { margin: 8px 0; padding: 10px; border: 1px solid #e1e5eb; border-radius: 9px; background: #f8f9fb; font-size: 13px; }
    .registro-historial strong, .registro-historial small { display: block; }
    .registro-historial small { margin-top: 4px; color: #647184; }
    .dialogo { width: min(calc(100% - 32px), 350px); max-height: min(82vh, 720px); overflow-y: auto; padding: 18px; border: 0; border-radius: 16px; color: #223c61; background: white; box-shadow: 0 12px 40px #223c6140; }
    .dialogo::backdrop { background: #17243b80; }
    .dialogo-cerrar { display: block; margin-left: auto; }
    .mensaje { min-height: 20px; font-size: 14px; }
    @media (max-width: 430px) { body { display: block; background: #f8f9fb; } main { width: 100%; height: 100vh; height: 100dvh; min-height: 100vh; min-height: 100dvh; box-shadow: none; } }
  </style>
  <script src="/app/tareas.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>Tareas</h1>
      <a class="volver" href="/app/">Menú principal</a>
    </header>

    <section class="bloque">
      <h2>Nueva tarea o consulta</h2>
      <div class="botones">
        <button id="boton-nueva-tarea" type="button">Nueva tarea</button>
        <button id="boton-recargar" class="secundario" type="button">Actualizar lista</button>
      </div>
      <label for="buscar-tarea">Buscar tarea</label>
      <input id="buscar-tarea" type="search" placeholder="Descripción, solicitante o estado" autocomplete="off">
      <p id="cantidad-tareas" class="mensaje"></p>
      <div id="lista-tareas" class="lista-scroll" aria-live="polite"></div>
      <p id="mensaje-lista" class="mensaje" role="status"></p>
    </section>
  </main>

  <dialog id="dialogo-nueva-tarea" class="dialogo" aria-labelledby="titulo-nueva-tarea">
    <button class="secundario dialogo-cerrar" type="button" data-cerrar="dialogo-nueva-tarea">Cerrar</button>
    <h2 id="titulo-nueva-tarea">Nueva tarea</h2>
    <form id="formulario-nueva-tarea">
      <label for="descripcion-nueva">Descripción</label>
      <textarea id="descripcion-nueva" maxlength="2000" required></textarea>
      <label for="solicitante-nueva">Solicitante</label>
      <input id="solicitante-nueva" readonly>
      <label for="fecha-nueva">Fecha de solicitud</label>
      <input id="fecha-nueva" type="date" required>
      <label for="observaciones-nueva">Observaciones</label>
      <textarea id="observaciones-nueva" maxlength="4000"></textarea>
      <p id="mensaje-nueva" class="mensaje" role="status"></p>
      <div class="botones"><button id="boton-guardar-nueva" type="submit">Guardar tarea</button></div>
    </form>
  </dialog>

  <dialog id="dialogo-tarea" class="dialogo" aria-labelledby="detalle-descripcion">
    <button class="secundario dialogo-cerrar" type="button" data-cerrar="dialogo-tarea">Cerrar</button>
    <section id="vista-tarea" class="detalle">
      <h2 id="detalle-descripcion"></h2>
      <p id="detalle-solicitante"></p>
      <p id="detalle-fecha"></p>
      <p id="detalle-observaciones"></p>
      <span id="detalle-estado" class="estado"></span>
      <p id="mensaje-detalle-tarea" class="mensaje" role="status"></p>
      <h3>Historial</h3>
      <ul id="lista-historial" class="historial"></ul>
      <div class="botones"><button id="boton-editar-tarea" type="button">Modificar</button></div>
    </section>
    <form id="formulario-editar-tarea" hidden>
      <h2>Modificar tarea</h2>
      <label for="descripcion-edicion">Descripción</label>
      <textarea id="descripcion-edicion" maxlength="2000" required></textarea>
      <label for="solicitante-edicion">Solicitante</label>
      <input id="solicitante-edicion" readonly>
      <label for="fecha-edicion">Fecha de solicitud</label>
      <input id="fecha-edicion" type="date" required>
      <label for="estado-edicion">Estado</label>
      <select id="estado-edicion" required>
        <option value="PENDIENTE">Pendiente</option>
        <option value="EN PROCESO">En proceso</option>
        <option value="FINALIZADA">Finalizada</option>
        <option value="CANCELADA">Cancelada</option>
      </select>
      <label for="observaciones-edicion">Observaciones</label>
      <textarea id="observaciones-edicion" maxlength="4000"></textarea>
      <p id="mensaje-edicion" class="mensaje" role="status"></p>
      <div class="botones">
        <button id="boton-guardar-edicion" type="submit">Guardar cambios</button>
        <button id="boton-cancelar-edicion" class="secundario" type="button">Volver al detalle</button>
      </div>
    </form>
  </dialog>
</body>
</html>
