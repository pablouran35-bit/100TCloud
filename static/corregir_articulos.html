<main><a href="/app/administracion_menu.html">← Administración</a><h1>Corregir artículos de solicitudes</h1>
<p>Reemplazá “Otros” por el artículo correcto. Se conservan cantidad, observaciones, estado y movimientos. Los cambios quedan en el historial.</p>
<form id="buscar-planilla"><label for="numero">Número de planilla</label><input id="numero" type="number" min="1" required><button>Abrir planilla</button></form>

<p><a href="/app/administracion_articulos.html" target="_blank" rel="noopener">Cargar un artículo nuevo en el catálogo</a>. Después volvé a abrir la planilla para actualizar la lista.</p>
<label for="buscar-articulo">Buscar artículo correcto</label><input id="buscar-articulo" type="search"><label for="articulo">Artículo del catálogo</label><select id="articulo" required></select><button id="guardar">Guardar artículo correcto</button></form>
</main><script src="/app/corregir_articulos.js" defer></script></html>
