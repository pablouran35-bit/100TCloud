<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reportes · 100TCompras</title>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #e4e8ed; color: #223c61; font-family: Arial, sans-serif; }
    main { width: min(100%, 390px); height: min(844px, 100vh); min-height: 0; margin: 0 auto; padding: 20px 16px; background: #f8f9fb; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 12px 40px #223c6126; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    h1 { margin: 0; font-size: 22px; } h2 { margin: 0 0 12px; font-size: 18px; }
    .volver { color: #365d8d; text-decoration: none; white-space: nowrap; font-size: 14px; }
    .bloque { padding: 13px; border: 1px solid #e1e5eb; border-radius: 14px; background: white; }
    label { display: block; margin: 9px 0 5px; font-size: 13px; font-weight: bold; }
    select, input { width: 100%; min-height: 40px; padding: 8px 10px; border: 1px solid #cbd2dc; border-radius: 9px; color: #223c61; background: white; font: inherit; }
    .filtros { display: grid; grid-template-columns: 1fr 1fr; gap: 0 9px; max-height: 260px; overflow-y: auto; }
    .filtros .campo:first-child { grid-column: 1 / -1; }
    .botones { display: flex; gap: 8px; margin-top: 11px; }
    button { min-height: 40px; padding: 9px 12px; border: 0; border-radius: 9px; background: #223c61; color: white; font: inherit; cursor: pointer; }
    .secundario { background: #eaf1fb; color: #223c61; }
    #mensaje { min-height: 20px; margin: 9px 0; font-size: 13px; }
    #resultados { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
    .resultado { margin: 8px 0; padding: 12px; border: 1px solid #e1e5eb; border-radius: 11px; background: white; font-size: 14px; }
    .resultado strong { display: block; margin-bottom: 5px; }
    .resultado p { margin: 4px 0; line-height: 1.4; overflow-wrap: anywhere; }
    .ayuda { color: #647184; font-size: 13px; }
    @media (max-width: 430px) { body { display: block; background: #f8f9fb; } main { width: 100%; height: 100vh; height: 100dvh; min-height: 100vh; min-height: 100dvh; box-shadow: none; } }
  </style>
  <script src="/app/reportes.js" defer></script>
</head>
<body>
  <main>
    <header><h1>Reportes</h1><a class="volver" href="/app/administracion_menu.html">Administración</a></header>
    <section class="bloque">
      <label for="tipo-reporte">Tipo de reporte</label>
      <select id="tipo-reporte">
        <option value="solicitudes">Solicitudes</option>
        <option value="compras">Compras</option>
        <option value="entregas">Entregas</option>
        <option value="obras">Obras</option>
      </select>
      <div id="filtros" class="filtros"></div>
      <div class="botones">
        <button id="aplicar" type="button">Ver reporte</button>
        <button id="limpiar" class="secundario" type="button">Limpiar</button>
      </div>
    </section>
    <p id="mensaje" class="ayuda" role="status"></p>
    <section id="resultados" aria-live="polite"></section>
  </main>
</body>
</html>
